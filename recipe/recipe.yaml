context:
  version: "1.3.5"

package:
  name: communique
  version: ${{ version }}

source:
  url: https://github.com/jdx/communique/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a589a2f5d1a9dce63fded1a0d98f2826389648bf6b0f5e8b3d0d28f2dd10326f

build:
  number: 1
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: "1" # force CMake builder for `aws-lc-sys` native C code, required to make cross-compilation work
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/communique
          - ^$bin completion bash | save ($prefix)/share/bash-completion/completions/communique
          - ^$bin completion fish | save ($prefix)/share/fish/vendor_completions.d/communique.fish
          - ^$bin completion zsh  | save ($prefix)/share/zsh/site-functions/_communique

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - nushell
    - if: unix
      then: make

tests:
  - script:
      - communique --help
      - communique --version
  - package_contents:
      bin:
        - communique
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/communique
            - share/fish/vendor_completions.d/communique.fish
            - share/zsh/site-functions/_communique
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/communique
            - Library/share/fish/vendor_completions.d/communique.fish
            - Library/share/zsh/site-functions/_communique
      strict: true

about:
  summary: Editorialized release notes powered by AI
  description: |
    communiqué turns your Git history, pull requests, and repository context into
    polished release notes optimized for human consumption. It can print notes locally,
    update `CHANGELOG.md`, or publish directly to GitHub releases.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://communique.jdx.dev
  repository: https://github.com/jdx/communique

extra:
  recipe-maintainers:
    - salim-b
